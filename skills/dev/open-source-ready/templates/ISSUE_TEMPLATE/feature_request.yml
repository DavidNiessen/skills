name: Idea
description: Suggest something new or better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it make better
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How it could work.
    validations:
      required: true

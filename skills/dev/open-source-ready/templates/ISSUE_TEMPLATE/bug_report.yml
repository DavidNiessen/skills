name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. <first step in this project's words>
        2. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - <platform / surface 1>
        - <platform / surface 2>
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: <where the user finds it>
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Logs, screenshots, configuration. Remove anything private.
